name: QA verification or milestone gate
description: Record observed repository validation, rights-audit, conformance, or L0-L4 gate evidence (never fabricate unexecuted passes).
title: "[QA] "
labels: ["type:test", "kind:gate"]
body:
  - type: markdown
    attributes:
      value: |
        Follow [Quality Requirements](https://github.com/Astraive/asciiwall-library/blob/main/docs/quality-requirements.md) and [Roadmap](https://github.com/Astraive/asciiwall-library/blob/main/docs/roadmap.md).
        - Record only actually observed runs, artifact hashes, and reference hardware environments.
        - Missing pinned engine binaries, missing rights evidence, or unimplemented conformance suites remain **Blocked**, never skipped-green.
  - type: input
    id: gate-id
    attributes:
      label: Gate or review ID
      description: Milestone gate (`LQA-L0`..`LQA-L4`) or quality task (`LQA-001`..`LQA-004`).
      placeholder: e.g. LQA-L0 or LQA-001
    validations:
      required: true
  - type: dropdown
    id: milestone
    attributes:
      label: Milestone
      options:
        - L0 - Library Foundation
        - L1 - Package and Catalog Tooling
        - L2 - Starter Collection Alpha
        - L3 - Compatible Library 1.0
        - L4 - Maintenance
    validations:
      required: true
  - type: dropdown
    id: evidence-category
    attributes:
      label: Evidence categories covered
      multiple: true
      options:
        - Repository / Policy / Script Checks
        - Schema & Catalog Fixtures
        - Rights & Attribution Ledger Audit
        - Pinned-Engine Pack / Validate / Bake
        - Named Hardware Resource Measurement
        - Key Rotation / Recovery Drill (nonproduction)
        - Cross-Platform Conformance Matrix
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Verified environment and engine pin
      description: Exact OS/hardware tuple, Python/PowerShell versions, and pinned `schemas/engine-schema-lock.json` revision (or `Repository scripts / CI only`).
    validations:
      required: true
  - type: textarea
    id: procedure
    attributes:
      label: Verification commands and procedure
      description: Exact commands executed or manual human curation steps performed.
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: Observed outcome
      options:
        - Planned / Not yet executed
        - Pass (all in-scope checks verified)
        - Fail (blocking defect found)
        - Blocked (missing pinned engine or asset prerequisite)
        - Waived (non-security P1/P2 only, linked follow-up required)
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Observed results and artifact hashes
      description: Exact command output, SHA-256 digests, dimensions, and residual limitations.
    validations:
      required: true
  - type: checkboxes
    id: gate-checklist
    attributes:
      label: Gate integrity checklist
      options:
        - label: Zero unresolved P0 security, archive-escape, unauthorized-rights, or hash-mismatch failures exist.
          required: true
        - label: Only actually executed tests and verified hardware/engine runs are marked passing.
          required: true
        - label: Evidence contains no secrets, signing keys, PII permission proofs, or unredacted private host paths.
          required: true
